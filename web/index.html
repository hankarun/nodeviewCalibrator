<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Node View Calibrator - Web</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="web-styles.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.183.2/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.2/examples/jsm/"
    }
  }
  </script>
</head>
<body>  
  <div class="container">
    <div class="main-header">
      <h1 style="margin: 0;">Node View Calibrator <span class="web-badge">Web</span></h1>
      <div class="file-operations">
        <button id="newConfigBtn" title="Create new configuration">New</button>
        <button id="openConfigBtn" title="Open saved configuration">Open</button>
        <button id="saveConfigBtn" title="Save configuration">Save</button>
        <button id="saveAsConfigBtn" title="Save configuration as">Save As</button>
        <input type="file" id="fileInput" accept=".json" style="display: none;">
      </div>
    </div>
    
    <div class="main-layout">
      <!-- Left Column: Display List & Settings -->
      <div class="left-column">
        <div class="display-list-panel">
          <h2>Display List</h2>
          <div id="displayList" class="display-list">
            <div class="empty-list-message">No displays added yet</div>
          </div>
        </div>

        <div class="tab-container">
          <div class="tab-header">
            <button class="tab-btn active" data-target="tab-display-settings">Display Settings</button>
            <button class="tab-btn" data-target="tab-model">3D Model</button>
          </div>

        <div class="input-group tab-panel" id="tab-display-settings">
          <h2>Display Settings</h2>
          <div class="input-row">
            <label for="presetSize">Preset Size:</label>
            <select id="presetSize">
              <option value="">Custom</option>
              <option value="27">27" (0.598 × 0.336m)</option>
              <option value="32">32" (0.708 × 0.398m)</option>
              <option value="40">40" (0.886 × 0.498m)</option>
              <option value="43">43" (0.952 × 0.535m)</option>
              <option value="50">50" (1.107 × 0.623m)</option>
              <option value="55">55" (1.218 × 0.685m)</option>
              <option value="65">65" (1.440 × 0.810m)</option>
              <option value="75">75" (1.660 × 0.934m)</option>
            </select>
          </div>
          <div class="input-row">
            <label for="displayName">Display Name:</label>
            <input type="text" id="displayName" value="" placeholder="e.g., Center, Left, Right">
          </div>
          <div class="input-row">
            <label for="displayWidth">Width (m):</label>
            <input type="number" id="displayWidth" value="0.5" step="0.01">
          </div>
          <div class="input-row">
            <label for="displayHeight">Height (m):</label>
            <input type="number" id="displayHeight" value="0.3" step="0.01">
          </div>
          <div class="input-row">
            <label for="displayAngle">Yaw (degrees):</label>
            <input type="number" id="displayAngle" value="0" step="1">
          </div>
          <div class="input-row">
            <label for="displayPitch">Pitch (degrees):</label>
            <input type="number" id="displayPitch" value="0" step="1">
          </div>
          <div class="input-row">
            <label for="displayRoll">Roll (degrees):</label>
            <input type="number" id="displayRoll" value="0" step="1">
          </div>
          <div class="input-row">
            <label for="displayOffsetX">X position (m):</label>
            <input type="number" id="displayOffsetX" value="0" step="0.01">
          </div>
          <div class="input-row">
            <label for="displayOffsetY">Y position (m):</label>
            <input type="number" id="displayOffsetY" value="0" step="0.01">
          </div>
          <div class="input-row">
            <label for="displayOffsetZ">Z position (m):</label>
            <input type="number" id="displayOffsetZ" value="0.7" step="0.01">
          </div>

          <div class="input-row">
            <label for="nearPlane">Near Plane (m):</label>
            <input type="number" id="nearPlane" value="" step="0.01" min="0.01" placeholder="auto" title="Near plane distance for projection (leave empty to use computed nearest point distance)">
          </div>
          <div class="input-row">
            <label for="showNearPlane">Show near plane always:</label>
            <input type="checkbox" id="showNearPlane" title="Always show this display's near plane, not only when selected">
          </div>
          <div class="button-row">
            <button id="addDisplayBtn">Add Display</button>
            <button id="updateDisplayBtn" disabled>Update Display</button>
            <button id="deleteDisplayBtn" disabled>Delete Display</button>
          </div>
        </div>

        <div class="input-group model-section tab-panel hidden" id="tab-model">
          <h2>3D Model</h2>
          <div class="button-row">
            <button id="loadFbxBtn">Load FBX</button>
          </div>
          <div id="modelList" class="model-list"><div class="empty-list-message">No models loaded</div></div>
          <input type="file" id="fbxFileInput" accept=".fbx" style="display: none;">
          <div class="input-row">
            <label for="modelPosX">X position (m):</label>
            <input type="number" id="modelPosX" value="0" step="0.01" disabled>
          </div>
          <div class="input-row">
            <label for="modelPosY">Y position (m):</label>
            <input type="number" id="modelPosY" value="0" step="0.01" disabled>
          </div>
          <div class="input-row">
            <label for="modelPosZ">Z position (m):</label>
            <input type="number" id="modelPosZ" value="0" step="0.01" disabled>
          </div>
          <div class="input-row">
            <label for="modelRotYaw">Yaw (degrees):</label>
            <input type="number" id="modelRotYaw" value="0" step="1" disabled>
          </div>
          <div class="input-row">
            <label for="modelRotPitch">Pitch (degrees):</label>
            <input type="number" id="modelRotPitch" value="0" step="1" disabled>
          </div>
          <div class="input-row">
            <label for="modelRotRoll">Roll (degrees):</label>
            <input type="number" id="modelRotRoll" value="0" step="1" disabled>
          </div>
          <div class="input-row">
            <label for="modelScale">Scale:</label>
            <input type="number" id="modelScale" value="1" step="0.01" min="0.001" disabled>
          </div>
        </div>
        </div><!-- /.tab-container -->
      </div>
      
      <!-- Middle Column: 3D Viewport + Display Info -->
      <div class="middle-column">
        <div class="viewport-wrapper">
          <div id="viewport3d" class="viewport-container"></div>
          <div class="viewport-toolbar">
            <div class="camera-controls">
              <button id="orbitModeBtn" class="viewport-btn active" title="Orbit camera (rotate around scene)">Orbit</button>
              <button id="fpModeBtn" class="viewport-btn" title="First-person view from eye position">First Person</button>
              <button id="resetCameraBtn" class="viewport-btn" title="Reset camera to default position">Reset Camera</button>
            </div>
            <div class="gizmo-controls">
              <button id="translateModeBtn" class="viewport-btn active" title="Translate mode (T)">Move</button>
              <button id="rotateModeBtn" class="viewport-btn" title="Rotate mode (R)">Rotate</button>
            </div>
          </div>
        </div>
        <div class="display-info-bar">
          <div id="projectionResults">
            <div class="info-placeholder">Select a display to see projection info</div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="web-renderer.js"></script>
</body>
</html>
