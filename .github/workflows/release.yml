name: Release

# Push a tag like "v1.2.3" (matching the version in package.json) to build
# Windows and macOS installers and publish them to a GitHub Release. The
# in-app updater (desktop/updater.js) reads that release's assets to offer
# updates, so every published tag needs a matching .exe and .dmg attached.
#
# Building and publishing are deliberately separate jobs. Each build uploads
# what it produced as a workflow artifact before anything is published, so a
# run always keeps its installers even when a platform fails or the release
# step does — v1.1.0 built and then vanished because nothing was stored. The
# publish job then attaches everything that did build to a single release,
# rather than each matrix job racing to create the same one.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist
            platform: windows
          - os: macos-latest
            script: dist:mac
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run ${{ matrix.script }} -- --publish never
        env:
          # No Apple/Windows signing certificate is configured for this
          # project; keep electron-builder from trying to auto-discover one.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Runs even when the build failed, so a partial dist/ is still
      # recoverable from the run instead of being thrown away with the runner.
      - name: Upload installers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.blockmap
            dist/*.yml
          if-no-files-found: warn
          retention-days: 30

  publish:
    needs: build
    # One platform failing to build should not cost the other one its release.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: installers

      - name: List what will be published
        run: |
          ls -lR installers
          if [ -z "$(find installers -type f -print -quit)" ]; then
            echo "No installers were built — nothing to publish." >&2
            exit 1
          fi

      # Idempotent: re-running the workflow for a tag updates the existing
      # release instead of failing on "release already exists".
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" installers/* \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" installers/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
